<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти - WEB_PROJECT</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js" defer></script>
</head>
<body>
    <div class="site-layout">
        <header class="site-header">
            <div class="header-brand">WEB_PROJECT</div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Головна</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="contact.html">Контакти</a></li>
                </ul>
            </nav>
            <button id="theme-toggle" class="theme-toggle-btn" type="button">🌓 Тема</button>
        </header>

        <main class="site-main">
            <h1>Форма зворотного зв'язку</h1>
            <form action="#" method="post" class="styled-form">
                <fieldset>
                    <legend>Контактні дані</legend>
                    <div class="form-group">
                        <label for="name">Ім'я здобувача:</label>
                        <input type="text" id="name" name="name" required placeholder="Вкажіть ПІБ">
                    </div>
                    <div class="form-group">
                        <label for="email">Електронна пошта:</label>
                        <input type="email" id="email" name="email" required placeholder="name@domain.com">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Параметри запиту</legend>
                    <div class="form-group">
                        <label for="message">Зміст звернення:</label>
                        <textarea id="message" name="message" rows="4" required placeholder="Опишіть ваше запитання"></textarea>
                    </div>
                </fieldset>
                <button type="submit" class="btn-primary">Надіслати повідомлення</button>
            </form>
        </main>

        <aside class="site-sidebar">
            <h3>Довідка</h3>
            <p>Усі поля форми перевіряються вбудованими механізмами браузера.</p>
        </aside>

        <footer class="site-footer">
            <p>&copy; 2026 Навчальний проєкт. Херсонський державний університет.</p>
        </footer>
    </div>
</body>
</html>
